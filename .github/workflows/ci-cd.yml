name: CI y entrega de imagen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip check
      - run: python -m unittest discover -s tests -v
      - name: Construir y probar el flujo completo dentro de la imagen
        run: |
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -t temperatura-ci .
          docker run --rm temperatura-ci python scripts/smoke.py 2>&1 | tee smoke.log
      - name: Publicar imagen verificada
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag temperatura-ci "$IMAGE"
          docker push "$IMAGE"
          docker inspect --format='{{json .RepoDigests}}' "$IMAGE" > imagen.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-ci
          path: |
            smoke.log
            imagen.json
