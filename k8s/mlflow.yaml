apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: apiario-v1
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: apiario-v1
spec:
  replicas: 1
  strategy:
    type: Recreate  # SQLite: un servidor sobre un volumen persistente.
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: mlflow
          image: temperatura-mlops:1.0.0
          imagePullPolicy: IfNotPresent
          command: [python, -m, mlflow, server]
          args:
            - --host=0.0.0.0
            - --port=5000
            - --workers=1
            - --gunicorn-opts=--threads=4
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --serve-artifacts
            - --default-artifact-root=mlflow-artifacts:/
            - --artifacts-destination=/mlflow/artifacts
          ports:
            - containerPort: 5000
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 15
          volumeMounts:
            - name: datos
              mountPath: /mlflow
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: apiario-v1
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
