apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperatura-api
  namespace: apiario-v1
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: temperatura-api
  template:
    metadata:
      labels:
        app: temperatura-api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: api
          image: temperatura-mlops:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MODEL_VERSION_EXPECTED
              valueFrom:
                configMapKeyRef:
                  name: modelo-desplegado
                  key: version
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          startupProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: temperatura-api
  namespace: apiario-v1
spec:
  type: NodePort
  selector:
    app: temperatura-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
