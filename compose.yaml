name: temperatura-v1

services:
  mlflow:
    build: .
    image: temperatura-mlops:1.0.0
    command:
      - python
      - -m
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --default-artifact-root=mlflow-artifacts:/
      - --artifacts-destination=/mlflow/artifacts
    ports:
      - "127.0.0.1:15050:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
    restart: unless-stopped

  inicializar:
    image: temperatura-mlops:1.0.0
    command: ["python", "-m", "src.inicializar"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - type: bind
        source: ../dataset/temperature_schwartau.csv
        target: /entrada/temperature_schwartau.csv
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    image: temperatura-mlops:1.0.0
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      inicializar:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  mlflow-data:
